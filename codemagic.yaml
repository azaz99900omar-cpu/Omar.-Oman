workflows:
  hammer-v7-verified:
    name: HAMMER AI V7 Verified
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Unpack HAMMER
        script: |
          rm -rf "$CM_BUILD_DIR/source"
          mkdir -p "$CM_BUILD_DIR/source"
          unzip -o "$CM_BUILD_DIR/HAMMER-AI-V7-VERIFIED-source.zip" -d "$CM_BUILD_DIR/source"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/source/HAMMER/local.properties"
      - name: Install Gradle 8.9
        script: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR/source/HAMMER"
          /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleDebug
    artifacts:
      - source/HAMMER/app/build/outputs/apk/debug/*.apk
