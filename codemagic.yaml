workflows:
  gamepilot-android-debug:
    name: GamePilot AI Android Debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Unpack GamePilot AI V2 source
        script: |
          rm -rf "$CM_BUILD_DIR/source"
          mkdir -p "$CM_BUILD_DIR/source"
          unzip -o "$CM_BUILD_DIR/GamePilotAI-v2-source.zip" -d "$CM_BUILD_DIR/source"

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/source/GamePilotAI/local.properties"

      - name: Install Gradle 8.9
        script: |
          curl -L --fail --retry 3 -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          rm -rf /tmp/gradle-8.9
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

      - name: Build installable APK
        script: |
          cd "$CM_BUILD_DIR/source/GamePilotAI"
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

    artifacts:
      - source/GamePilotAI/app/build/outputs/apk/debug/*.apk
